name: Publish firmware release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify committed firmware and manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json, hashlib, os, pathlib, re
          m=json.loads(pathlib.Path('update-manifest.json').read_text())
          assert os.environ['RELEASE_TAG']=='v'+m['version']
          assert m['file']=='firmware-app-at-0x10000.bin'
          assert m['target']=='xiao_esp32s3' and m['schema']==1
          assert re.search(r'VERSION\[\] = "'+re.escape(m['version'])+'"',pathlib.Path('src/main.cpp').read_text())
          b=pathlib.Path(m['file']).read_bytes()
          assert len(b)==m['size'] and hashlib.sha256(b).hexdigest()==m['sha256']
          assert m['firmwareId'].encode() in b and b[12:14]==b'\x09\x00'
          PY
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already published; leaving it unchanged."
          else
            gh release create "$RELEASE_TAG" firmware-app-at-0x10000.bin update-manifest.json --verify-tag --title "Diesel Heater Gateway $RELEASE_TAG" --notes-file RELEASE_NOTES.md
          fi
